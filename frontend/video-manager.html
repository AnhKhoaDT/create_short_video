<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Video - AI Short Video Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/video-manager.css">
    <link rel="stylesheet" href="./css/app.css">
    <script src="https://code.iconify.design/iconify-icon/1.0.5/iconify-icon.min.js"></script>
</head>
<body class="font-sans">
    <div class="main-container">
        <div id="header-placeholder"></div>
        <main class="pt-20">
            <section class="video-manager-section">
                <div class="container mx-auto px-4 py-8">
                    <div class="flex items-center justify-between mb-8">
                        <h1 class="text-3xl font-bold text-gray-800">Quản lý video</h1>
                        <div class="flex items-center gap-4">
                            <button id="refreshBtn" class="refresh-btn" onclick="refreshVideos()">
                                <iconify-icon icon="mdi:refresh" class="mr-2"></iconify-icon>
                                Làm mới
                            </button>
                            <button class="create-video-btn" onclick="window.location.href='./homepage.html?scroll=script'">
                                <iconify-icon icon="mdi:video-plus" class="mr-2"></iconify-icon>
                                Tạo video mới
                            </button>
                        </div>
                    </div>
                    <div id="videoList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Loading state -->
                        <div class="col-span-full flex justify-center items-center py-12">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                            <span class="ml-3 text-gray-600">Đang tải danh sách video...</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal xem trước video -->
    <div id="previewModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <video id="previewVideo" controls class="w-full rounded-lg shadow"></video>
            <h3 id="previewTitle" class="text-xl font-bold mt-4 mb-2"></h3>
            <p id="previewDesc" class="text-gray-600 mb-4"></p>
        </div>
    </div>

    <script src="./javascript/video-manager.js"></script>
    <script src="./javascript/header.js"></script>
</body>
</html>
